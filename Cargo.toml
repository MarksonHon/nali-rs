[package]
name = "nalide"
version = "0.1.0"
edition = "2021"
description = "An offline tool for querying IP geographic information and CDN provider"
license = "MIT"
repository = "https://github.com/user/nalide"
keywords = ["cli", "geoip", "ip", "network"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
# 核心依赖
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
colored = "2.0"
rustyline = "13.0"
directories = "5.0"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.11", features = ["blocking", "json"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"

# 数据库相关
maxminddb = "0.23"
geosite-rs = "0.1"
prost = "0.12"
regex = "1.0"
encoding_rs = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Globalization", "Win32_System_Console"] }

# 表格输出
comfy-table = "7.0"

# 其他工具
atty = "0.2"
open = "5.0"
dirs = "5.0"

# 异步运行时（用于 reqwest）
tokio = { version = "1.0", features = ["full"] }

[dev-dependencies]
tempfile = "3.8"
assert_cmd = "2.0"
predicates = "3.0"

[[bin]]
name = "nali"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true